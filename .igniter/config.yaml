# diffwalk's Igniter workflow. Credentials come from the environment.
project: diffwalk
team: Starcoder

max_running: 3

runbooks:
  build: .igniter/workflow/build.md
  acceptance: .igniter/workflow/acceptance.md
  deliver: .igniter/workflow/deliver.md

# Agent overrides may set any profile field (commander, builder,
# builder.fallback, acceptance, deliverer: harness, model, effort).
# Omitted profiles inherit src/commander/config.yaml.
agents:
  builder:
    harness: opencode
    model: opencode-go/deepseek-v4.1-flash
    # DeepSeek V4.1 Flash defaults to high, its recommended effort for daily
    # agent work. OpenCode's interactive TUI has no --variant launch option.

  acceptance:
    harness: claude
    model: claude-sonnet-5
